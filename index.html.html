<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Hadiah Spesial! 💖✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container Kartu Pink Imut */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem 2rem;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 4px solid #ffb6c1;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        /* Efek Melayang Halus */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .emoji-header {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .card h1 {
            font-size: 1.4rem;
            margin-bottom: 1.8rem;
            line-height: 1.5;
            color: #d63384;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-yes {
            background-color: #ff6b81;
            color: white;
        }

        .btn-yes:hover {
            background-color: #ff4757;
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
        }

        .btn-no {
            background-color: #ffb8b8;
            color: #574b90;
        }

        .btn-no:hover {
            background-color: #ffa4a4;
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(255, 164, 164, 0.4);
        }

        /* Container Video Jumpscare Fullscreen */
        #jumpscare-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Tampilan Kartu Pink Imut -->
    <div class="card" id="main-card">
        <div class="emoji-header">🎁✨🎀</div>
        <h1>Aku ada hadiah spesial buat kamu, kamu mau lihat gak?? 
            🥺👉👈</h1>
        <div class="button-group">
            <button class="btn btn-yes" onclick="playJumpscare()">Mau! 💖</button>
            <button class="btn btn-no" onclick="playJumpscare()">Engga 🙈</button>
        </div>
    </div>

    <!-- Container Video Jumpscare -->
    <div id="jumpscare-container">
        <!-- Pastikan nama file video .mp4 kamu ditaruh di folder yang sama -->
        <video id="jumpscare-video" playsinline>
            <source src="c:\Users\dell\Downloads\tiktokio.com1791450989_p3igEjj022wn7hln8VJB.mp4" type="video/mp4">
            Browser kamu tidak mendukung pemutaran video.
        </video>
    </div>

    <script>
        function playJumpscare() {
            // Sembunyikan kartu pink
            document.getElementById('main-card').style.display = 'none';

            const videoContainer = document.getElementById('jumpscare-container');
            const video = document.getElementById('jumpscare-video');
            
            videoContainer.style.display = 'block';

            // Coba aktifkan mode Fullscreen
            if (videoContainer.requestFullscreen) {
                videoContainer.requestFullscreen().catch(() => {});
            } else if (videoContainer.webkitRequestFullscreen) {
                videoContainer.webkitRequestFullscreen();
            } else if (videoContainer.msRequestFullscreen) {
                videoContainer.msRequestFullscreen();
            }

            // Putar video dengan volume penuh
            video.currentTime = 0;
            video.volume = 1.0;
            video.play().catch(error => {
                console.log("Error play video: ", error);
            });
        }
    </script>

</body>
</html>
